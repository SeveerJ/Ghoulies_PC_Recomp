; Grabbed by the Ghoulies - settings. Edit with Notepad, or press F1 in the game.

[Display]
; Height the game is drawn at, in steps of the original 480 lines:
;   480, 960, 1440, 1920, 2400 or 2880 (1x-6x). 960 suits most laptops;
;   480 if it struggles, 1440 or more for a strong graphics card.
Resolution = 960
; 1 = 16:9 widescreen, 0 = original 4:3.
Widescreen = 1
; Trim the black border Xbox games leave for old TVs, in percent per side (0-20).
CropX = 0
CropY = 0
; 1 = fill the screen (borderless). Alt+Enter switches while playing.
Fullscreen = 0
; Window height when not fullscreen.
WindowHeight = 720
; Frame rate cap: 60, or 30 as on the original Xbox (the game runs at the right speed either way). 0 = no cap.
FrameRateCap = 60
; 1 = wait for the monitor's refresh when showing a frame (no tearing, more lag).
VSync = 0
; Anti-aliasing (smooths jagged edges): 0 = off, 1 = smooth scaling (best when
;   Resolution is above the screen's), 2 = smooth scaling + FXAA.
AntiAliasing = 2

[Audio]
; 0 to 100.
Volume = 50
; Sound effects relative to music, 0 to 100.
SfxVolume = 70

[Controller]
; 1 = the pad rumbles when the game asks it to.
Rumble = 1
; 0 to 100.
RumbleStrength = 100
